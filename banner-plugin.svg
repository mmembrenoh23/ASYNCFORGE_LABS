<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 250" width="100%" height="100%">
  <!-- Fondo con degradado Pro -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="100%" stop-color="#141d40" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="772" height="250" fill="url(#bg-gradient)" />
  
  <!-- Detalles tecnológicos de fondo (Líneas de red atenuadas) -->
  <circle cx="600" cy="125" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2" />
  <circle cx="600" cy="125" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />
  <line x1="450" y1="125" x2="750" y2="125" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1" />

  <!-- TEXTO PRINCIPAL (Izquierda) -->
  <g transform="translate(60, 0)">
    <!-- Etapa / Categoría -->
    <text x="0" y="80" fill="#3b82f6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">WOOCOMMERCE EXTENSION</text>
    
    <!-- Nombre del Plugin -->
    <text x="0" y="130" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="0.5">
      Bulk Importer <tspan fill="#10b981">Pro</tspan>
    </text>
    
    <!-- Subtítulo / Propuesta de valor -->
    <text x="0" y="165" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      Asynchronous two-phase high-performance data engine.
    </text>
  </g>

  <!-- ICONO / ELEMENTO GRÁFICO (Derecha) -->
  <g transform="translate(540, 55)">
    <!-- Círculo de brillo trasero -->
    <circle cx="60" cy="65" r="55" fill="#3b82f6" fill-opacity="0.15" filter="blur(10px)" />
    
    <!-- Icono de Servidor / Base de datos masiva -->
    <!-- Caja Superior (Fase 1) -->
    <rect x="20" y="20" width="80" height="24" rx="4" fill="none" stroke="url(#accent-gradient)" stroke-width="3" />
    <circle cx="35" cy="32" r="4" fill="#3b82f6" />
    <line x1="55" y1="32" x2="85" y2="32" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    
    <!-- Caja Media (Fase 2) -->
    <rect x="20" y="52" width="80" height="24" rx="4" fill="none" stroke="url(#accent-gradient)" stroke-width="3" />
    <circle cx="35" cy="64" r="4" fill="#10b981" />
    <line x1="55" y1="64" x2="85" y2="64" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Caja Inferior (Logs / Engine) -->
    <rect x="20" y="84" width="80" height="24" rx="4" fill="none" stroke="url(#accent-gradient)" stroke-width="3" opacity="0.7"/>
    <circle cx="35" cy="96" r="4" fill="#64748b" />
    
    <!-- Rayo de velocidad / Carga asíncrona que cruza el icono -->
    <path d="M65,5 L40,65 L60,65 L50,120 L85,50 L65,50 Z" fill="#f59e0b" opacity="0.9" />
  </g>
</svg>
